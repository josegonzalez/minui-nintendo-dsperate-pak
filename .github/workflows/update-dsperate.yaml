---
name: "update-dsperate"

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: update
    runs-on: ubuntu-24.04
    env:
      # A pull request opened with the default GITHUB_TOKEN does not trigger
      # other workflows, so ci.yaml would never build it. GH_ACCESS_TOKEN lets
      # CI run; without it the pull request still opens, just unbuilt.
      PR_TOKEN: ${{ secrets.GH_ACCESS_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ env.PR_TOKEN }}

      - name: Compare with the latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --repo beebono/DSperate --json tagName --jq .tagName)"
          pinned="$(make --no-print-directory print-DSPERATE_TAG | cut -d= -f2)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "branch=build/update-dsperate-$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$pinned" ]; then
            echo "DSperate $pinned is the latest release"
            exit 0
          fi
          # One branch per release. Re-running against an existing one would
          # reset it and throw away a patch rebase someone pushed there.
          if git ls-remote --exit-code --heads origin "build/update-dsperate-$latest" >/dev/null; then
            echo "build/update-dsperate-$latest already exists"
            exit 0
          fi
          echo "update=true" >> "$GITHUB_OUTPUT"

      - name: Pin the new release
        if: steps.release.outputs.update == 'true'
        run: scripts/bump-dsperate.sh "${{ steps.release.outputs.latest }}"

      # The clone rule applies every patch and fails on the first one that no
      # longer applies. No toolchain is needed for that, so it runs here and
      # the result goes in the pull request; the full build is ci.yaml's.
      - name: Check the patches still apply
        id: patches
        if: steps.release.outputs.update == 'true'
        run: |
          mkdir -p tmp
          if make clone >tmp/clone.log 2>tmp/clone.err; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
            cat tmp/clone.log tmp/clone.err
          fi
          {
            echo "log<<CLONE_LOG_EOF"
            cat tmp/clone.log tmp/clone.err
            echo "CLONE_LOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.release.outputs.update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ env.PR_TOKEN }}
          add-paths: |
            Makefile
            README.md
          commit-message: "feat: update DSperate to ${{ steps.release.outputs.latest }}"
          title: "feat: update DSperate to ${{ steps.release.outputs.latest }}"
          body: |
            Moves the pinned DSperate release from ${{ steps.release.outputs.pinned }} to [${{ steps.release.outputs.latest }}](https://github.com/beebono/DSperate/releases/tag/${{ steps.release.outputs.latest }}).

            ${{ steps.patches.outputs.applied == 'true' && 'Every patch in `patches/` still applies.' || 'At least one patch in `patches/` no longer applies and has to be rebased on this branch before it can build. The clone log is below.' }}

            Before merging, read the upstream release notes for renamed or new CMake options and for a save state format change, and re-measure the ABI table in `TECHNICAL.md` if it moved, as described in "Bumping the upstream version".

            <details><summary>make clone</summary>

            ```
            ${{ steps.patches.outputs.log }}
            ```

            </details>
          branch: ${{ steps.release.outputs.branch }}
          delete-branch: true
